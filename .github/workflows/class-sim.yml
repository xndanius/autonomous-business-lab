name: Class simulation

# 38 fictional SSE Riga students discuss business ideas.
# Every ~5 minutes a few of them speak. Data goes to the sim-data branch,
# which the Simulation page reads. To stop: set the repository variable
# SIM_PAUSED to 1, or disable this workflow in the Actions tab.
#
# A manual run can also cover a fixed stretch of time: for example
# ticks=70 and gap=5 runs one tick every 5 minutes for about 6 hours, then ends.
# parts=2 runs two such parts one after another (about 12 hours), then ends.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      ticks:
        description: "Ticks to run (1-70)"
        default: "1"
      gap:
        description: "Minutes between ticks (0 = back to back)"
        default: "0"
      parts:
        description: "Parts of up to 6 hours, run one after another"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"

permissions:
  contents: write

concurrency:
  group: class-sim
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event.inputs.parts == '4' && '[1,2,3,4]' || github.event.inputs.parts == '3' && '[1,2,3]' || github.event.inputs.parts == '2' && '[1,2]' || '[1]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Get the chat data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO" sim-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch sim-data --single-branch "$REPO" data
          else
            mkdir -p data
            git -C data init --quiet
          fi

      - name: Let the class talk
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIM_MODEL: ${{ vars.SIM_MODEL }}
          SIM_FALLBACK_MODEL: ${{ vars.SIM_FALLBACK_MODEL }}
          SIM_REASONING: ${{ vars.SIM_REASONING }}
          SIM_PRICE_IN: ${{ vars.SIM_PRICE_IN }}
          SIM_PRICE_OUT: ${{ vars.SIM_PRICE_OUT }}
          SIM_PRICE_CACHED: ${{ vars.SIM_PRICE_CACHED }}
          SIM_DAILY_CAP_USD: ${{ vars.SIM_DAILY_CAP_USD }}
          SIM_SPEAKERS: ${{ vars.SIM_SPEAKERS }}
          SIM_NIGHT_SPEAKERS: ${{ vars.SIM_NIGHT_SPEAKERS }}
          SIM_PAUSED: ${{ vars.SIM_PAUSED }}
          TICKS: ${{ github.event.inputs.ticks || '1' }}
          GAP: ${{ github.event.inputs.gap || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          N=$(printf '%s' "$TICKS" | tr -cd '0-9'); N=${N:-1}
          [ "$N" -lt 1 ] && N=1
          [ "$N" -gt 70 ] && N=70
          G=$(printf '%s' "$GAP" | tr -cd '0-9'); G=${G:-0}
          [ "$G" -gt 10 ] && G=10
          if [ "$G" -eq 0 ]; then
            node sim/engine.mjs --data data --ticks "$N" $FORCE
            bash sim/save.sh
            exit 0
          fi
          for i in $(seq 1 "$N"); do
            if [ "$SIM_PAUSED" = "1" ] || [ "$SIM_PAUSED" = "true" ]; then echo "Paused."; break; fi
            START=$(date +%s)
            node sim/engine.mjs --data data --ticks 1 $FORCE || echo "tick $i failed"
            bash sim/save.sh || echo "save $i failed"
            FORCE=""
            if [ "$i" -lt "$N" ]; then
              WAIT=$(( G * 60 - ($(date +%s) - START) ))
              [ "$WAIT" -gt 0 ] && sleep "$WAIT"
            fi
          done
