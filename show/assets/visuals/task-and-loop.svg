<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,Helvetica,sans-serif" class="wide" viewBox="0 0 1000 400" role="img" aria-label="A task ends. A loop takes the next order."><text x="24" y="80" font-size="15" font-weight="700" fill="#7F8B86" letter-spacing=".16em" font-family="DM Sans, Arial, sans-serif">A TASK</text><rect x="135.0" y="50.0" width="140" height="48" rx="24.0" fill="#1B222B" stroke="#38434F" stroke-width="2"/><text x="205.0" y="81.0" text-anchor="middle" font-size="20" font-weight="700" fill="#EEF2EA" font-family="Space Grotesk, Arial, sans-serif">Request</text><line x1="277" y1="74" x2="333.0" y2="74.0" stroke="#B7C1BA" stroke-width="3" stroke-linecap="round"/><polygon points="349.4,74.0 331.4,65.0 331.4,83.0" fill="#B7C1BA"/><rect x="345.0" y="50.0" width="140" height="48" rx="24.0" fill="#1B222B" stroke="#38434F" stroke-width="2"/><text x="415.0" y="81.0" text-anchor="middle" font-size="20" font-weight="700" fill="#EEF2EA" font-family="Space Grotesk, Arial, sans-serif">Work</text><line x1="487" y1="74" x2="543.0" y2="74.0" stroke="#B7C1BA" stroke-width="3" stroke-linecap="round"/><polygon points="559.4,74.0 541.4,65.0 541.4,83.0" fill="#B7C1BA"/><rect x="555.0" y="50.0" width="140" height="48" rx="24.0" fill="#1B222B" stroke="#7F8B86" stroke-width="2"/><text x="625.0" y="81.0" text-anchor="middle" font-size="20" font-weight="700" fill="#B7C1BA" font-family="Space Grotesk, Arial, sans-serif">Done</text><rect x="712" y="62" width="24" height="24" rx="4" fill="#7F8B86"/><text x="752" y="70" font-size="18" font-weight="700" fill="#EEF2EA" text-anchor="start" font-family="DM Sans, Arial, sans-serif">It ends.</text><text x="752" y="94" font-size="16" font-weight="400" fill="#B7C1BA" text-anchor="start" font-family="DM Sans, Arial, sans-serif">Next time, you start again.</text><line x1="24" y1="140" x2="976" y2="140" stroke="#38434F" stroke-width="1" stroke-dasharray="4 6"/><text x="24" y="278" font-size="15" font-weight="700" fill="#B9E46B" letter-spacing=".16em" font-family="DM Sans, Arial, sans-serif">A LOOP</text><ellipse cx="445" cy="272" rx="235" ry="82" fill="none" stroke="#B9E46B" stroke-width="3.5"/><polygon points="293.9,208.7 271.8,205.9 278.3,224.8" fill="#B9E46B"/><polygon points="626.3,219.3 610.7,203.3 604.1,222.1" fill="#B9E46B"/><polygon points="596.1,335.3 618.2,338.1 611.7,319.2" fill="#B9E46B"/><polygon points="263.7,324.7 279.3,340.7 285.9,321.9" fill="#B9E46B"/><rect x="145.0" y="249.0" width="130" height="46" rx="23.0" fill="#1B222B" stroke="#B9E46B" stroke-width="2"/><text x="210.0" y="279.0" text-anchor="middle" font-size="20" font-weight="700" fill="#EEF2EA" font-family="Space Grotesk, Arial, sans-serif">Order</text><rect x="380.0" y="167.0" width="130" height="46" rx="23.0" fill="#1B222B" stroke="#B9E46B" stroke-width="2"/><text x="445.0" y="197.0" text-anchor="middle" font-size="20" font-weight="700" fill="#EEF2EA" font-family="Space Grotesk, Arial, sans-serif">Make</text><rect x="615.0" y="249.0" width="130" height="46" rx="23.0" fill="#1B222B" stroke="#F4A259" stroke-width="2"/><text x="680.0" y="279.0" text-anchor="middle" font-size="20" font-weight="700" fill="#EEF2EA" font-family="Space Grotesk, Arial, sans-serif">Check</text><rect x="380.0" y="331.0" width="130" height="46" rx="23.0" fill="#1B222B" stroke="#B9E46B" stroke-width="2"/><text x="445.0" y="361.0" text-anchor="middle" font-size="20" font-weight="700" fill="#EEF2EA" font-family="Space Grotesk, Arial, sans-serif">Deliver</text><text x="445" y="278" font-size="15" font-weight="400" fill="#7F8B86" text-anchor="middle" font-family="DM Sans, Arial, sans-serif">next order ↺</text><text x="800" y="252" font-size="18" font-weight="700" fill="#EEF2EA" text-anchor="start" font-family="DM Sans, Arial, sans-serif">It runs again</text><text x="800" y="276" font-size="16" font-weight="400" fill="#B7C1BA" text-anchor="start" font-family="DM Sans, Arial, sans-serif">on the next order,</text><text x="800" y="298" font-size="16" font-weight="400" fill="#B7C1BA" text-anchor="start" font-family="DM Sans, Arial, sans-serif">without you.</text></svg>
